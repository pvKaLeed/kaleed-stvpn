name: Update VPN Gate Servers

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  update-servers:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ← ဒါကို ထည့်ပေးရမယ်
    
    steps:
      # Step 1: Checkout repository with token
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # ← GitHub Actions default token
          
      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      # Step 4: Run the script
      - name: Run VPN Gate updater
        run: |
          python vgate_servers.py
          
      # Step 5: Commit and push changes
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/servers.json
          git diff --staged --quiet || git commit -m "🔄 Auto-update servers.json $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # ← Token ကို env အနေနဲ့ ထည့်ပေးရမယ်
